services:
  board:
    build:
      context: .
      args:
        # Match the container user to yours so files written into applications/
        # are owned by you on the host rather than by root.
        #
        # macOS: ignore this, Docker Desktop handles ownership. Just run
        #   docker compose up --build
        #
        # Linux: set them, or the files will belong to the wrong user:
        #   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up --build
        #
        # Note these are HOST_UID/HOST_GID, not UID/GID: bash makes UID a
        # readonly variable, so `UID=$(id -u) ...` fails with
        # "bash: UID: readonly variable".
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: jobs-finder-board
    container_name: jobs-finder-board

    # Published to loopback ONLY. Your job search is not on your network.
    # Changing this to "8765:8765" exposes the board to everyone on your LAN.
    ports:
      - "127.0.0.1:8765:8765"

    volumes:
      # Your data lives on the host, not in the container. Delete the container
      # whenever you like; the applications folder is the source of truth.
      - ./applications:/app/applications
      # Optional: keep connector config on the host too.
      - ./config:/app/config:ro

    environment:
      BOARD_PORT: "8765"
      BOARD_HOST: "0.0.0.0"
      BOARD_NO_BROWSER: "1"

    restart: unless-stopped
